services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: coachpulse_postgres
    environment:
      POSTGRES_DB: CoachPulseDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - coachpulse_postgres_data:/var/lib/postgresql/data

volumes:
  coachpulse_postgres_data: